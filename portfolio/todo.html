<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jane | To-Do List</title>
<style>
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e6e6e6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background: #111111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 1.5rem;
    color: #ff4d94;
    margin-bottom: 1.5rem;
    text-align: center;
    letter-spacing: 2px;
  }
  .input-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .input-row input {
    flex: 1;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    background: #0a0a0a;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  .input-row button {
    padding: 0.75rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: #ff4d94;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  .input-row button:hover {
    background: #ff7fb0;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem;
    border-bottom: 1px solid #2a2a2a;
    transition: 0.2s;
  }
  li:hover {
    background: #1a1a1a;
  }
  li.done span {
    text-decoration: line-through;
    color: #a0a0a0;
  }
  li input[type="checkbox"] {
    accent-color: #ff4d94;
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  li span {
    flex: 1;
  }
  li button {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #a0a0a0;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  li button:hover {
    color: #ff4d4d;
    border-color: #ff4d4d;
  }
  .empty {
    text-align: center;
    color: #a0a0a0;
    padding: 2rem;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>TO-DO</h1>
    <div class="input-row">
      <input type="text" id="todoInput" placeholder="Add a new task..." />
      <button onclick="addTodo()">Add</button>
    </div>
    <ul id="todoList"></ul>
    <div id="emptyMsg" class="empty">No tasks yet. Add one above.</div>
  </div>

  <script>
    const input = document.getElementById('todoInput');
    const list = document.getElementById('todoList');
    const emptyMsg = document.getElementById('emptyMsg');

    function updateEmpty() {
      emptyMsg.style.display = list.children.length ? 'none' : 'block';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      const li = document.createElement('li');
      li.className = 'todo-item';
      li.innerHTML = '<input type="checkbox" onchange="toggleTodo(this)"><span>' + escapeHtml(text) + '</span><button onclick="deleteTodo(this)">Delete</button>';
      list.appendChild(li);
      input.value = '';
      updateEmpty();
    }

    function toggleTodo(cb) {
      cb.parentElement.classList.toggle('done', cb.checked);
    }

    function deleteTodo(btn) {
      btn.parentElement.remove();
      updateEmpty();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addTodo();
    });

    updateEmpty();
  </script>
</body>
</html>
